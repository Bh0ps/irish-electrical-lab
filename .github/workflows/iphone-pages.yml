name: Publish iPhone web app

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lab/package-lock.json
      - name: Install and verify the mobile build
        working-directory: lab
        run: |
          npm run install:ci
          npm run web:build
          npm run web:audit
      - uses: actions/upload-pages-artifact@v4
        with:
          path: lab/dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
